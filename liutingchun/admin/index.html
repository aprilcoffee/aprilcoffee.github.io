<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Site Admin</title>
  <style>
    :root {
      --bg: #fff; --fg: #111; --muted: #8a8a8a; --line: #e6e6e6; --tint: #f6f6f6; --accent: #111;
      --sans: "Inter", "Noto Sans TC", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--fg); font: 18px/1.55 var(--sans); }
    a { color: inherit; }
    button, input, textarea, select { font: inherit; color: inherit; }

    .side {
      position: fixed; inset: 0 auto 0 0; width: 270px; padding: 28px 22px;
      border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px;
      background: var(--bg);
    }
    .side h1 { font-size: 18px; font-weight: 500; margin: 0 0 24px; }
    .side h1 small { display: block; color: var(--muted); font-weight: 400; }
    .side button {
      text-align: left; background: none; border: 0; padding: 6px 10px; border-radius: 4px;
      color: var(--muted); cursor: pointer;
    }
    .side button:hover { color: var(--fg); }
    .side button.on { color: var(--fg); background: var(--tint); }
    .side .foot { margin-top: auto; font-size: 15.5px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
    .side .foot a { text-decoration: none; }
    .side .foot a:hover { color: var(--fg); }

    .main { margin-left: 270px; min-height: 100vh; padding: 28px 40px 80px; }
    .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; min-height: 32px; }
    .bar h2 { font-size: 23.5px; font-weight: 500; margin: 0; flex: 1; }
    .status { font-size: 15.5px; color: var(--muted); }

    .btn {
      background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
      padding: 5px 12px; cursor: pointer;
    }
    .btn:hover { border-color: var(--fg); }
    .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn.danger:hover { border-color: #c00; color: #c00; }
    .btn.sm { padding: 2px 8px; font-size: 15.5px; }

    .form { max-width: 1000px; display: flex; flex-direction: column; gap: 16px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 15.5px; color: var(--muted); }
    label.check { flex-direction: row; align-items: center; gap: 8px; color: var(--fg); font-size: 18px; }
    input[type=text], input[type=password], textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px;
      background: var(--bg); color: var(--fg); font-size: 18px;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--fg); }
    textarea { resize: vertical; min-height: 80px; line-height: 1.55; }
    textarea.lines { font-family: var(--mono); font-size: 15.5px; white-space: pre; }
    textarea.tall { min-height: 320px; }
    .hint { font-size: 15.5px; color: var(--muted); margin: -8px 0 0; }

    .split { display: grid; grid-template-columns: 340px 1fr; gap: 32px; align-items: start; }
    .items { border: 1px solid var(--line); border-radius: 4px; max-height: calc(100vh - 120px); overflow: auto; position: sticky; top: 28px; }
    .item {
      display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; cursor: pointer;
      border-bottom: 1px solid var(--line);
    }
    .item:last-child { border-bottom: 0; }
    .item:hover { background: var(--tint); }
    .item.on { background: var(--fg); color: #fff; }
    .item .y { font-family: var(--mono); font-size: 14.5px; opacity: .6; }
    .item.off span:first-child { text-decoration: line-through; opacity: .5; }

    .thumbs { display: flex; flex-wrap: wrap; gap: 6px; }
    .thumbs img { width: 72px; height: 48px; object-fit: cover; background: var(--tint); }

    .card { border: 1px solid var(--line); border-radius: 4px; padding: 20px; max-width: 1000px; }
    .card h3 { margin: 0 0 12px; font-size: 18px; font-weight: 500; }
    .card p { margin: 0 0 12px; color: var(--muted); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .stack { display: flex; flex-direction: column; gap: 20px; }
    .log { font-family: var(--mono); font-size: 15.5px; color: var(--muted); white-space: pre-wrap; }

    @media (max-width: 800px) {
      .side { position: static; width: auto; flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px; }
      .side h1 { width: 100%; margin-bottom: 8px; }
      .side .foot { display: none; }
      .main { margin-left: 0; padding: 20px 16px 60px; }
      .split, .row { grid-template-columns: 1fr; }
      .items { position: static; max-height: 240px; }
    }
  </style>
</head>
<body>
  <aside class="side" id="side">
    <h1>網站後台<small>liutingchun</small></h1>
    <button data-tab="works">作品 Works</button>
    <button data-tab="performances">表演影片 Performance</button>
    <button data-tab="about">關於 / CV</button>
    <button data-tab="writing">文章 Blog</button>
    <button data-tab="friends">朋友 Friends</button>
    <button data-tab="site">網站設定</button>
    <button data-tab="publish">發佈 Publish</button>
    <div class="foot">
      <a href="../preview.html?preview" target="ltc-preview">預覽草稿 ↗</a>
      <a href="../" target="_blank">線上網站 ↗</a>
      <span id="saved"></span>
    </div>
  </aside>
  <main class="main" id="main"></main>
  <script src="admin.js"></script>
</body>
</html>
