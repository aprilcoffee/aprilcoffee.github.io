# Regenerates the static pages of liutingchun/ whenever its content changes
# (for example after publishing from liutingchun/admin/), and commits the result.
name: Build liutingchun

on:
  push:
    branches: [main]
    paths:
      - "liutingchun/data/**"
      - "liutingchun/posts/**"
      - "liutingchun/scripts/build.py"
      - "liutingchun/assets/**"
      - ".github/workflows/build-liutingchun.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-liutingchun
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown
      - run: python liutingchun/scripts/build.py
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A liutingchun robots.txt sitemap.xml llms.txt
          if git diff --cached --quiet; then
            echo "Pages already up to date."
            exit 0
          fi
          git commit -m "Rebuild liutingchun pages"
          git pull --rebase origin main
          git push origin HEAD:main
