# Checks every external link used by liutingchun/ (works, CV, friends, posts).
# Run it from the Actions tab; it also runs on the 1st of every month.
# The report is shown in the run summary. It never fails the build.
name: Check links

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *"
  push:
    paths:
      - ".github/workflows/check-links.yml"

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 2
            --timeout 30
            --accept "200..=299,429,999"
            --exclude "dl\.acm\.org|academia\.edu|moma\.org|raspberrypi\.org|realvnc\.com"
            --exclude "liutingchun/posts/images/"
            --exclude "celscelscels\.wixsite\.com|seenlan\.wordpress\.com|zhe-zhi-lin\.weebly\.com|d4LyVxF7bjE"
            --user-agent "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Safari/605.1.15"
            liutingchun/data/site.json
            "liutingchun/posts/*.md"
          format: markdown
          output: lychee-report.md
          fail: false
          jobSummary: true
      - name: Print report
        run: cat lychee-report.md
      - name: Check videos (Vimeo / YouTube oEmbed)
        run: python3 liutingchun/scripts/check-videos.py | tee -a "$GITHUB_STEP_SUMMARY"
