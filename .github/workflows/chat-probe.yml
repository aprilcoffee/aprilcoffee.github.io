# Temporary: calls the chat Worker from a GitHub runner and tails its logs.
name: Chat probe
on:
  push:
    branches: [claude/busy-hypatia-uq1s8p]
    paths: [".github/workflows/chat-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm i -g wrangler@4 >/dev/null 2>&1
          (wrangler tail liutingchun-chat --format pretty > tail.log 2>&1 &)
          sleep 15
          U=https://liutingchun-chat.8765498-208.workers.dev
          curl -sS -m 60 -N -X POST "$U" -H 'Origin: https://aprilcoffee.github.io' -H 'Content-Type: application/json' \
            --data '{"messages":[{"role":"user","content":"What is Sun about?"}]}' -w '\nHTTP %{http_code}\n'
          sleep 10
          echo "=== tail"; cat tail.log
